version: '3.8'

services:
  app:
    build: .
    container_name: codentra-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=codentra
      - DB_USER=codentra
      - DB_PASSWORD=${DB_PASSWORD:-codentra123}
      - SESSION_SECRET=${SESSION_SECRET:-your-session-secret-change-this}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-this}
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - codentra-network

  db:
    image: postgres:15-alpine
    container_name: codentra-db
    restart: always
    environment:
      - POSTGRES_DB=codentra
      - POSTGRES_USER=codentra
      - POSTGRES_PASSWORD=${DB_PASSWORD:-codentra123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codentra -d codentra"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codentra-network

  nginx:
    image: nginx:alpine
    container_name: codentra-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - uploads:/app/uploads:ro
    depends_on:
      - app
    networks:
      - codentra-network

volumes:
  postgres_data:
  uploads:

networks:
  codentra-network:
    driver: bridge
